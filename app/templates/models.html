<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Model Registry — Debat-Zero</title>
<style>
  :root { --bg: #0f172a; --surface: #1e293b; --text: #e2e8f0; --accent: #38bdf8; --green: #4ade80; --red: #f87171; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
  nav a { color: var(--accent); text-decoration: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
  .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
  .badge.ok { background: #064e3b; color: var(--green); }
  .badge.missing { background: #7f1d1d; color: var(--red); }
  #or-models { margin-top: 2rem; }
  pre { background: var(--surface); padding: 1rem; border-radius: 8px; overflow-x: auto; margin-top: 1rem; font-size: 0.85rem; }
</style>
</head>
<body>
<nav><a href="/">← Dashboard</a> | <strong>Model Registry</strong></nav>
<h1>🧠 Available Models</h1>
<table id="models-table">
  <thead><tr><th>Key</th><th>Name</th><th>Provider</th><th>Group</th><th>API Key</th><th>Status</th></tr></thead>
  <tbody></tbody>
</table>

<div id="or-models">
  <h2>OpenRouter Models</h2>
  <button onclick="loadOpenRouterModels()">Fetch from OpenRouter</button>
  <pre id="or-output">Not yet loaded.</pre>
</div>

<script>
(async () => {
  const res = await fetch('/api/models');
  const { models } = await res.json();
  const tbody = document.querySelector('#models-table tbody');
  models.forEach(m => {
    const tr = document.createElement('tr');
    const cls = m.available ? 'ok' : 'missing';
    const label = m.available ? '✓ Available' : '✗ Key missing';
    tr.innerHTML = `<td><code>${m.key}</code></td><td>${m.display_name}</td><td>${m.provider}</td><td>${m.group}</td><td>${m.env_key || '—'}</td><td><span class="badge ${cls}">${label}</span></td>`;
    tbody.appendChild(tr);
  });
})();

async function loadOpenRouterModels() {
  const out = document.getElementById('or-output');
  out.textContent = 'Loading...';
  try {
    const res = await fetch('/api/openrouter/models');
    const data = await res.json();
    out.textContent = JSON.stringify(data.models?.slice(0, 20) || data, null, 2);
  } catch(e) { out.textContent = 'Error: ' + e.message; }
}
</script>
</body>
</html>

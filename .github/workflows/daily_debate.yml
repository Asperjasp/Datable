name: Daily Debate

on:
  schedule:
    - cron: '30 12 * * *'   # 7:30 AM Colombia (UTC-5)
    - cron: '30 2 * * *'    # 9:30 PM Colombia (UTC-5, = 2:30 AM UTC next day)
  workflow_dispatch:          # Manual trigger from GitHub UI
    inputs:
      date:
        description: 'Date to run (YYYY-MM-DD, leave empty for today)'
        required: false
        default: ''
      questions:
        description: 'Number of questions (1-10)'
        required: false
        default: '5'

jobs:
  run-debate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily debate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          QUESTIONS="${{ github.event.inputs.questions || '5' }}"
          python scripts/run_daily_debate.py $DATE_ARG --questions $QUESTIONS

      - name: Commit debate results
        run: |
          git config user.email "debate-bot@debat-zero.app"
          git config user.name "Debate Bot"
          git add data/orchestrated_debates/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: debate results $(date -u +%Y-%m-%d)"
          git push || true
